# Build, test and lint on every push and pull request. The eval gate (spec 16.2) is a second job that
# runs when a prompt, schema, ranking or ingest change could move recall.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Overrides the local default in .cargo/config.toml; the service container below listens on 5432.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  evals:
    # Only when something that decides what gets extracted or recalled changed.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Did prompts, schemas, ranking or ingest change?
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$base" HEAD -- prompts schemas evals crates/recall crates/ingest | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      # Fails (non-zero exit) when recall@5 drops more than 5% below evals/baseline.json.
      - if: steps.changed.outputs.run == 'true'
        run: cargo run --release -p memvault -- evals replay
        env:
          FAKE_TEI: "true"

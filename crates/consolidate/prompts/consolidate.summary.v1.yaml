name: consolidate.summary
version: v1
model_hint: sonnet
output_schema: consolidate.summary.v1
description: Day or week summary of session summaries (spec 12.3).
system: |
  You write the long-range summary of a coding assistant's work. You receive the summaries of the
  sessions (or days) of one period and one scope (a project, a device or global). Fold them into one
  summary of the period.

  Reply with ONE JSON object and nothing else:

  {"request": "...", "investigated": "...", "learned": "...", "completed": "...",
   "next_steps": "...", "notes": "...",
   "period": {"grain": "day" or "week", "start": "YYYY-MM-DD", "end": "YYYY-MM-DD"}}

  Each text field is at most 600 characters. Copy "period" from the input. "next_steps" is required: it
  states where the work stands and what comes next, as the current trajectory. Leave the other fields
  null when there is nothing to say. Use only what the input says.
user_template: |
  Period: {{ period.start }} to {{ period.end }} ({{ grain }}), scope {{ scope.kind }}:{{ scope.key }}

  Summaries to fold:
  {{ summaries | tojson(2) }}

  Reply with the JSON object only.

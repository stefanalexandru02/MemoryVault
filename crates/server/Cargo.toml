[package]
name = "memvault"
description = "MemoryVault server binary: serve, worker, planner, migrate, admin, evals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "memvault_server"
path = "src/lib.rs"

[[bin]]
name = "memvault"
path = "src/main.rs"

[dependencies]
memvault-core.workspace = true
memvault-ingest.workspace = true
memvault-recall.workspace = true
memvault-memories.workspace = true
memvault-consolidate.workspace = true
memvault-worker.workspace = true
memvault-evals.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
memvault-core = { workspace = true, features = ["test-support"] }

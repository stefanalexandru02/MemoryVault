# TEMPLATE ONLY. Not listed in kustomization.yaml and holds no real values.
# Create the real Secrets out of band (never commit them), for example:
#   kubectl -n memory create secret generic memory-secrets --from-literal=TOKEN_PEPPER="$(openssl rand -hex 32)"
#   kubectl -n memory create secret generic memory-pg-memsvc-app --type kubernetes.io/basic-auth \
#     --from-literal=username=memsvc_app --from-literal=password="$(openssl rand -hex 24)"
#   kubectl -n memory create secret generic memory-pg-memsvc-system --type kubernetes.io/basic-auth \
#     --from-literal=username=memsvc_system --from-literal=password="$(openssl rand -hex 24)"
#   kubectl -n memory create secret generic memory-backup-s3 \
#     --from-literal=ACCESS_KEY_ID=... --from-literal=SECRET_ACCESS_KEY=...
#
# The CloudNativePG operator does not generate passwords for managed roles (only the owner app secret).
# The two basic-auth Secrets above are therefore created here, and the managed.roles entries in
# postgres-cluster.yaml point at them. TOKEN_PEPPER must be stable: changing it invalidates every token.
#
# No Claude or Anthropic credential belongs in this namespace (spec D2).
#
# Shape only. No value is placed here on purpose: an empty TOKEN_PEPPER would give the token HMAC an empty
# key (spec 5.2, 11), and an empty password would make a role's login meaningless. Each Secret below must be
# created out of band with the keys named in its comment before the first apply. The workloads reference
# these keys without `optional`, so a missing key keeps the pod from starting (CreateContainerConfigError).
#
# memory-secrets
#   TOKEN_PEPPER: must be set, non-empty, stable. Changing it invalidates every token.
#   (The server itself does not yet refuse an empty pepper; see the foundation request in the deploy notes.)
apiVersion: v1
kind: Secret
metadata:
  name: memory-secrets
type: Opaque
---
# memory-pg-memsvc-app: keys username=memsvc_app, password=<generated>
apiVersion: v1
kind: Secret
metadata:
  name: memory-pg-memsvc-app
type: kubernetes.io/basic-auth
---
# memory-pg-memsvc-system: keys username=memsvc_system, password=<generated>
apiVersion: v1
kind: Secret
metadata:
  name: memory-pg-memsvc-system
type: kubernetes.io/basic-auth
---
# memory-backup-s3: keys ACCESS_KEY_ID, SECRET_ACCESS_KEY
apiVersion: v1
kind: Secret
metadata:
  name: memory-backup-s3
type: Opaque

# Worker: `memvault worker` (embed jobs, lease-expiry and idle-window sweeps every 30 s, context re-render,
# retention). One replica; it runs as the system role because the sweeps cross spaces.
#
# No Service, ServiceMonitor or container port here: `memvault worker` binds no HTTP listener yet, so there
# is nothing to scrape. Once the worker serves /metrics, restore the memory-worker Service (port 8000 to
# the named port), the memory-worker ServiceMonitor and the worker-ingress NetworkPolicy (monitoring to 8000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-worker
  labels:
    app: memory-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memory-worker
  template:
    metadata:
      labels:
        app: memory-worker
        memvault.io/db-client: "true"
        memvault.io/tei-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: memvault:0.1.0
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: memory-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-pg-memsvc-system
                  key: password
            - name: DATABASE_URL
              value: postgres://memsvc_system:$(DB_PASSWORD)@memory-pg-rw:5432/memsvc?sslmode=require
            - name: DATABASE_SYSTEM_URL
              value: postgres://memsvc_system:$(DB_PASSWORD)@memory-pg-rw:5432/memsvc?sslmode=require
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: prompts
              mountPath: /app/prompts
              readOnly: true
            - name: schemas
              mountPath: /app/schemas
              readOnly: true
      volumes:
        - name: prompts
          configMap:
            name: memory-prompts
        - name: schemas
          configMap:
            name: memory-schemas

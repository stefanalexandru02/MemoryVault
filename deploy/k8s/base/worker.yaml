# Worker: `memvault worker` (embed jobs, lease-expiry and idle-window sweeps every 30 s, context re-render,
# retention). One replica; it runs as the system role because the sweeps cross spaces. It serves /metrics
# and /health on HOST:PORT (WORKER_METRICS_ADDR overrides), scraped by the memory-worker ServiceMonitor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-worker
  labels:
    app: memory-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memory-worker
  template:
    metadata:
      labels:
        app: memory-worker
        memvault.io/db-client: "true"
        memvault.io/tei-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: memvault:0.1.0
          args: ["worker"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: memory-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-pg-memsvc-system
                  key: password
            - name: DATABASE_URL
              value: postgres://memsvc_system:$(DB_PASSWORD)@memory-pg-rw:5432/memsvc?sslmode=require
            - name: DATABASE_SYSTEM_URL
              value: postgres://memsvc_system:$(DB_PASSWORD)@memory-pg-rw:5432/memsvc?sslmode=require
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: prompts
              mountPath: /app/prompts
              readOnly: true
            - name: schemas
              mountPath: /app/schemas
              readOnly: true
      volumes:
        - name: prompts
          configMap:
            name: memory-prompts
        - name: schemas
          configMap:
            name: memory-schemas
---
apiVersion: v1
kind: Service
metadata:
  name: memory-worker
  labels:
    app: memory-worker
spec:
  selector:
    app: memory-worker
  ports:
    - name: http
      port: 8000
      targetPort: http

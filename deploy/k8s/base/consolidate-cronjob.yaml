# Nightly consolidation planning: `memvault planner` (no model; the planner only builds work packets).
# Forbid overlapping runs; the planner is idempotent per window, so a missed night is caught up the next run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: memory-consolidate
  labels:
    app: memory-consolidate
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: memory-consolidate
            memvault.io/db-client: "true"
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: planner
              image: memvault:0.1.0
              args: ["planner"]
              envFrom:
                - configMapRef:
                    name: memory-config
              env:
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: memory-pg-memsvc-system
                      key: password
                - name: DATABASE_URL
                  value: postgres://memsvc_system:$(DB_PASSWORD)@memory-pg-rw:5432/memsvc?sslmode=require
                - name: DATABASE_SYSTEM_URL
                  value: postgres://memsvc_system:$(DB_PASSWORD)@memory-pg-rw:5432/memsvc?sslmode=require
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
